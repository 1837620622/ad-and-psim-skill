name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install optional dependencies
        run: python -m pip install -r requirements-optional.txt ruff
      - name: Style and static check
        run: |
          ruff format --check skills scripts tests
          ruff check skills scripts tests
      - name: Node entry point
        run: node --check bin/cli.mjs
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example plans pass the layout check
        run: |
          python skills/ad-schematic-layout/scripts/check_layout.py skills/ad-schematic-layout/assets/rc-filter-plan.json --strict
          python skills/psim-simulation-layout/scripts/check_layout.py skills/psim-simulation-layout/assets/rc-filter-plan.json --strict
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"
