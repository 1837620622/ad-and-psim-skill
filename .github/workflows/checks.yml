name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional dependencies
        run: python -m pip install pillow olefile pyflakes
      - name: Static check
        run: python -m pyflakes skills scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example plans pass the layout check
        run: |
          python skills/ad-schematic-layout/scripts/check_layout.py skills/ad-schematic-layout/assets/rc-filter-plan.json --strict
          python skills/psim-simulation-layout/scripts/check_layout.py skills/psim-simulation-layout/assets/rc-filter-plan.json --strict
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"
