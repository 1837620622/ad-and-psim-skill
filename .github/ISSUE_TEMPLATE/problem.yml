name: 问题反馈
description: 反馈建模、排版、仿真或兼容问题
title: "[问题] "
body:
  - type: input
    id: agent
    attributes:
      label: Agent 与宿主版本
      placeholder: Claude Code / Codex / Gemini CLI / Cursor / Copilot / OpenCode / MCP 客户端 / 其他
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: 操作系统、Python、AD 或 PSIM 版本
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04；Python 3.12；AD 26.4.1；PSIM 2026
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小任务描述与执行命令，客户保密工程可用简化电路替代。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与局部图
      description: 可附原生错误、求解日志、参数读回或排版截图，勿提交账号凭据。
